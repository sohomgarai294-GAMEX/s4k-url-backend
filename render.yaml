services:
  - type: web
    name: s4k-url-import
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: REQUIRE_LOGIN
        value: "1"
      - key: DEFAULT_DAILY_DOWNLOADS
        value: "15"
      - key: MAX_DOWNLOAD_SECONDS
        value: "1800"
      - key: ADMIN_KEY
        sync: false          # set a secret in the Render dashboard
      # --- these two are what actually fix YouTube ---
      - key: COOKIES_FILE
        value: "/app/cookies.txt"   # upload cookies.txt to the repo
      # - key: PROXY_URL
      #   value: "http://user:pass@residential-proxy:port"
      # --- optional free bot protection for YOUR backend ---
      # - key: TURNSTILE_SECRET
      #   sync: false
      # - key: TURNSTILE_SITE_KEY
      #   sync: false
